server:
  # Render menyediakan PORT; lokal tetap 4000
  port: ${PORT:4000}
  # Di belakang proxy (Render/Vercel): pakai header X-Forwarded-* untuk IP dan skema asli
  forward-headers-strategy: native

spring:
  config:
    # Baca .env di luar folder backend (root repo). "optional" = tidak error bila file tidak ada (mis. di Render).
    # ../.env  -> saat dijalankan dari folder backend (mvn spring-boot:run)
    # .env     -> saat dijalankan dari root repo atau IDE yang memakai root sebagai working directory
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_project}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
    hikari:
      # Kecil agar aman untuk batas koneksi Supabase/Render gratis
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

app:
  cors:
    origin: ${CORS_ORIGIN:http://localhost:3000}
  auth:
    # Wajib diisi (minimal 32 karakter). Buat dengan: openssl rand -base64 48
    jwt-secret: ${JWT_SECRET:}
    # Pendaftaran mandiri. Biarkan false selama data belum dipisah per pengguna (semua pengguna melihat data yang sama)
    registration-enabled: ${APP_REGISTRATION_ENABLED:false}
    # Client ID dari Google Cloud Console. Kosong = tombol Google disembunyikan
    google-client-id: ${GOOGLE_CLIENT_ID:}
    # true = kode verifikasi ditulis ke log bila SMTP belum diatur (HANYA untuk pengembangan)
    dev-log-codes: ${APP_DEV_LOG_CODES:false}
    token-ttl-minutes: ${TOKEN_TTL_MINUTES:480}
    # Deploy dengan HTTPS: COOKIE_SECURE=true. Frontend dan backend harus satu "site" (domain induk sama).
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    # Akun admin pertama, dibuat hanya jika tabel users masih kosong
    admin:
      username: ${APP_ADMIN_USERNAME:}
      password: ${APP_ADMIN_PASSWORD:}
      full-name: ${APP_ADMIN_FULL_NAME:Administrator}
      email: ${APP_ADMIN_EMAIL:}
  mail:
    from: ${APP_MAIL_FROM:no-reply@localhost}
# SMTP diatur lewat variabel lingkungan bawaan Spring: SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true,
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true